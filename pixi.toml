[workspace]
authors = ["sis92 <feel8.fun@gmail.com>"]
channels = ["conda-forge"]
name = "feel8-build"
version = "0.1.1"
description = "Feel8 meta package"
platforms = ["win-64", "linux-64"]
preview = ["pixi-build"]

[system-requirements]
# Pixi uses `system-requirements` to determine the compatible manylinux tag for PyPI wheels on linux.
# PySide6 6.10.1 wheels are published as `manylinux_2_34_x86_64`, so we must require glibc >= 2.34
# for the linux environment solve to succeed.
libc = { family = "glibc", version = "2.34" }

[feature.python.dependencies]
python = ">=3.14.3,<3.15"
pip = ">=26.0.1,<27"

[feature.vision.pypi-dependencies]
numpy = ">=2.4.2, <3"
opencv-contrib-python = ">=4.13.0.92, <5"

[feature.onnx.dependencies]
cuda-version = "12.*"
cudnn = ">=9,<10"

[feature.onnx.pypi-dependencies]
f8pydl = { path = "packages/f8pydl", editable = true }
onnxruntime-gpu = ">=1.24.2, <2"
pyyaml = ">=6.0.3, <7"

[feature.onnx.tasks]
f8pydl_detector = "python -m f8pydl.main_detector"
f8pydl_humandetector = "python -m f8pydl.main_humandetector"
f8pydl_classifier = "python -m f8pydl.main_classifier"
f8pydl_optflow = "python -m f8pydl.main_optflow"
f8pydl_detsorter = "python -m f8pydl.main_detsorter"
f8pydl_tcnwave = "python -m f8pydl.main_tcnwave"
f8pydl_bench = "python scripts/bench_dl_baseline.py"

[feature.sdk.pypi-dependencies]
f8pysdk = { path = "packages/f8pysdk", editable = true }

[feature.sdk.tasks]
runner = "python -m f8pysdk.headless_runner"
update_describes = "python scripts/update_static_describes.py"
protocol_codegen_py = "python scripts/protocol_codegen_msgspec.py --protocol schemas/protocol.yml --output packages/f8pysdk/f8pysdk/generated/__init__.py"
protocol_codegen_cpp = "python scripts/gen_cpp_protocol_models.py --protocol schemas/protocol.yml --out packages/f8cppsdk/include/f8cppsdk/generated/protocol_models.h"
protocol_codegen_all = "python scripts/protocol_codegen_msgspec.py --protocol schemas/protocol.yml --output packages/f8pysdk/f8pysdk/generated/__init__.py && python scripts/gen_cpp_protocol_models.py --protocol schemas/protocol.yml --out packages/f8cppsdk/include/f8cppsdk/generated/protocol_models.h"

[feature.test.dependencies]
pytest = ">=8.4.2,<9"

[feature.test.tasks]
pytest = "python -m pytest"
pytest_sdk = "python -m pytest -q packages/f8pysdk/tests"
pytest_studio = "python -m pytest -q packages/f8pystudio/tests"

[feature.audio.pypi-dependencies]
librosa = ">=0.11.0, <0.12"
f8pyaudiofeat = { path = "packages/f8pyaudiofeat", editable = true }

[feature.audio.tasks]
f8pyaudiofeat_core = "python -m f8pyaudiofeat.main_core"
f8pyaudiofeat_rhythm = "python -m f8pyaudiofeat.main_rhythm"

[feature.engine.pypi-dependencies]
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.8.0,<2"
f8pyengine = { path = "packages/f8pyengine", editable = true }
f8pyscript = { path = "packages/f8pyscript", editable = true }
f8proclauncher = { path = "packages/f8proclauncher", editable = true }

[feature.engine.tasks]
f8pyengine = "python -m f8pyengine.main"
f8pyscript = "python -m f8pyscript.main_script"
f8pyexpr = "python -m f8pyscript.main_expr"
f8proclauncher = "python -m f8proclauncher.main"

[feature.studio.pypi-dependencies]
f8pystudio = { path = "packages/f8pystudio", editable = true }
f8pystudio-ext-template-match = { path = "packages/f8pystudio_ext_template_match", editable = true }
f8pystudio-ext-viz-tcode = { path = "packages/f8pystudio_ext_viz_tcode", editable = true }
pyside6 = ">=6.10.2, <7"
qtpy = ">=2.4.3, <3"
pyqt-toast-notification = ">=1.3.3, <2"
pyqtgraph = ">=0.14.0, <0.15"
websockets = ">=16.0, <17"
aiortc = ">=1.14.0, <2"
basedpyright = ">=1.31.0, <2"

[feature.studio.tasks]
f8pystudio = "python -m f8pystudio.main"

[feature.mediapipe.pypi-dependencies]
f8pymppose = { path = "packages/f8pymppose", editable = true }
mediapipe = ">=0.10.32, <0.11"

[feature.mediapipe.tasks]
f8pymppose = "python -m f8pymppose.main_pose"

[feature.doc.pypi-dependencies]
zensical = ">=0.0.23,<0.1.0"
pyyaml = ">=6.0.3,<7"
mkdocs-static-i18n = ">=1.2.3,<2"

[feature.doc.tasks]
doc_gen = "python scripts/generate_service_docs.py && python scripts/generate_node_atlas.py"
doc_build = "zensical build"
doc_serve = "python scripts/zensical_serve_pretty.py"
doc_serve_raw = "zensical serve"
doc_check = "python scripts/generate_service_docs.py --check && python scripts/generate_node_atlas.py --check && python scripts/check_docs_nav.py && python scripts/check_docs_links.py"

[feature.cpp.dependencies]
pip = ">=26.0.1,<27"
conan = ">=2.23.0,<3"
cmake = ">=3.30,<5"
ninja = ">=1.13.0,<2"

[feature.cpp.target.linux-64.dependencies]
gxx_linux-64 = ">=11,<12"

[feature.cpp.tasks]
cpp_lock_refresh = "python scripts/cpp_ci.py lock-refresh"
cpp_bootstrap = "python scripts/cpp_ci.py bootstrap"
cpp_configure_release = "python scripts/cpp_ci.py configure"
cpp_build_release = "python scripts/cpp_ci.py build"

[feature.ci.dependencies]
python = ">=3.13,<3.14"
pip = ">=26.0.1,<27"
hatchling = ">=1.28.0,<2"
datamodel-code-generator = ">=0.35.0,<1"

[feature.ci.tasks]
dist_ci = "python scripts/dist_ci.py"

[feature.launcher.dependencies]
python = ">=3.13,<3.14"
pip = ">=26.0.1,<27"

[feature.launcher.pypi-dependencies]
nuitka = ">=2.7.17,<3"
hatchling = ">=1.28.0,<2"

[feature.launcher.tasks]
build_studio_launcher = "python scripts/build_studio_launcher.py"

[feature.launcher-runtime]

[environments]
default = { features = ["python", "sdk", "engine", "studio", "vision", "audio", "test", "launcher-runtime"], solve-group = "default" }
onnx = { features = ["python", "sdk", "onnx", "vision", "launcher-runtime"], solve-group = "onnx" }
mediapipe = { features = ["python", "sdk", "vision", "mediapipe", "launcher-runtime"], solve-group = "mediapipe" }
doc = { features = ["python", "doc"] }
cpp = { features = ["cpp"], solve-group = "cpp" }
ci = { features = ["ci"], solve-group = "ci" }
launcher = { features = ["launcher"], solve-group = "launcher" }
