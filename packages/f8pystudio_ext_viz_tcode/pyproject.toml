[project]
name = "f8pystudio-ext-viz-tcode"
version = "0.1.0"
description = "External viz_tcode plugin for F8PyStudio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "f8pystudio",
    "qtpy>=2.4.3",
    "pyside6>=6.10.1",
    "nodegraphqt>=0.6.43",
]

[project.entry-points."f8studio.pystudio.plugins"]
viz_tcode = "f8pystudio_ext_viz_tcode.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8pystudio_ext_viz_tcode"]
include = [
    "f8pystudio_ext_viz_tcode/render_nodes/web_assets/viz_tcode/**/*.html",
    "f8pystudio_ext_viz_tcode/render_nodes/web_assets/viz_tcode/**/*.css",
    "f8pystudio_ext_viz_tcode/render_nodes/web_assets/viz_tcode/**/*.js",
]

[tool.uv]
package = true
