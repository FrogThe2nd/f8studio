[project]
name = "f8pystudio"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qtpy>=2.4.3",
    "pyside6>=6.10.1",
    "keyring>=25.6.0",
    "setuptools",
    "nodegraphqt>=0.6.43",
    "pyqtgraph>=0.14.0",
    "datamodel-code-generator>=0.50.0",
    "shortuuid>=1.0.13",
    "basedpyright>=1.31.0",
    "agent-framework-core>=1.7.0,<2",
    "agent-framework-openai>=1.7.0,<2",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.18.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8pystudio"]
include = [
    "f8pystudio/render_nodes/web_assets/**/*.html",
    "f8pystudio/render_nodes/web_assets/**/*.js",
    "f8pystudio/render_nodes/web_assets/**/*.css",
    "f8pystudio/resources/**/*.svg",
    "f8pystudio/resources/**/*.png",
    "f8pystudio/resources/**/*.ico",
    "f8pystudio/resources/**/*.txt",
    "f8pystudio/resources/**/*.json",
]

[tool.uv]
package = true
