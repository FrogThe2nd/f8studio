[project]
name = "f8pystudio"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qtpy>=2.4.3",
    "pyside6>=6.10.1",
    "setuptools",
    "nodegraphqt>=0.6.43",
    "pyqtgraph>=0.14.0",
    "nats-py>=2.12.0",
    "datamodel-code-generator>=0.50.0",
    "shortuuid>=1.0.13",
    "basedpyright>=1.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8pystudio"]
include = [
    "f8pystudio/render_nodes/web_assets/**/*.html",
    "f8pystudio/render_nodes/web_assets/**/*.js",
    "f8pystudio/render_nodes/web_assets/**/*.css",
    "f8pystudio/assets/**/*.svg",
    "f8pystudio/assets/**/*.png",
    "f8pystudio/assets/**/*.ico",
    "f8pystudio/assets/**/*.txt",
    "f8pystudio/assets/**/*.json",
]

[tool.uv]
package = true
