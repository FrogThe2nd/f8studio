[project]
name = "f8pystudio-ext-template-match"
version = "0.1.0"
description = "External Template Match capture UI plugin for F8PyStudio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "f8pystudio",
    "qtpy>=2.4.3",
]

[project.entry-points."f8studio.pystudio.plugins"]
template_match = "f8pystudio_ext_template_match.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8pystudio_ext_template_match"]

[tool.uv]
package = true
