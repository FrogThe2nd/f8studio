name: dist-windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/dist-windows.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "conanfile.py"
      - "conan.lock"
      - "conan_recipes/**"
      - "pixi.toml"
      - "pixi.lock"
      - "scripts/cpp_ci.py"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warm-conan-cache:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: windows-2022
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Tag-scoped caches cannot be restored by other tag runs, so keep the
      # canonical Conan cache warm on the default branch instead.
      - name: Restore Conan cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}-${{ github.run_id }}
          restore-keys: |
            conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}-
            conan-Windows-

      - name: Check pixi lockfile
        run: pixi lock --check

      - name: Warm Conan cache
        run: pixi run --frozen -e cpp cpp_bootstrap

      - name: Save Conan cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}-${{ github.run_id }}

  build-windows-dist:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore Conan cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}
          restore-keys: |
            conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}-
            conan-Windows-

      - name: Check pixi lockfile
        run: pixi lock --check

      - name: Build runtime distribution
        run: pixi run --frozen -e ci dist_ci --archive

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          }
          else {
            $version = $env:GITHUB_SHA.Substring(0, 7)
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: f8studio-windows-${{ steps.version.outputs.value }}
          path: |
            build/dist/f8studio-windows-x86_64
            build/dist/f8studio-windows-x86_64.zip

      - name: Attach archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/dist/f8studio-windows-x86_64.zip
