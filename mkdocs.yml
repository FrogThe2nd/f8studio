site_name: F8Studio Documentation
site_description: Official guides for installation, module usage, and scenario-based workflows.
site_url: https://studio.feel8.fun
repo_name: Feel8-Fun/F8Studio
repo_url: https://github.com/feel8-fun/f8studio

docs_dir: docs
site_dir: site
strict: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation and Deployment: getting-started/install-deploy.md
      - Studio (GUI): getting-started/studio.md
      - Runner (Headless): getting-started/runner.md
  - Modules:
      - Overview: modules/index.md
      - Services:
          - Audio Feature Core: modules/services/f8-audiofeat-core.md
          - Audio Feature Rhythm: modules/services/f8-audiofeat-rhythm.md
          - DL Classifier: modules/services/f8-dl-classifier.md
          - DL Detector: modules/services/f8-dl-detector.md
          - DL Human Detector: modules/services/f8-dl-humandetector.md
          - DL Optical Flow: modules/services/f8-dl-optflow.md
          - DL TCN Wave: modules/services/f8-dl-tcnwave.md
          - PyEngine: modules/services/f8-pyengine.md
          - MediaPipe Pose: modules/services/f8-mp-pose.md
          - Python Expr Service: modules/services/f8-pyexpr.md
          - Python Script Service: modules/services/f8-pyscript.md
  - Scenarios:
      - Overview: scenarios/index.md
      - "Scene 01: CVKit Template Tracking": scenarios/scene-01-cvkit_template_tracking.md
      - "Scene 02: GameMod Skeleton": scenarios/scene-02-gamemod_skeleton.md
      - "Scene 03: Audio Driven TCode": scenarios/scene-03-audio_driven.md
      - "Scene 04: Functional TCode Generation": scenarios/scene-04-functional_tcode.md
  - Deep Dives:
      - System Architecture: deepdives/system_architecture.md
      - Lovense Local API: deepdives/LovenseLocalAPI.md
      - Lovense Mock Server: deepdives/LovenseMockServer.md

theme:
  name: material
  language: en
  logo: media/images/branding/logo_transparent.png
  favicon: media/images/branding/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: Chinese (Simplified)
          build: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mermaid.mjs
  - javascripts/i18n-switcher.mjs

extra:
  alternate:
    - name: English
      lang: en
      link: /
    - name: Chinese (Simplified)
      lang: zh
      link: /zh/
